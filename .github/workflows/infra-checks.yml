name: Infra checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Run yamllint
        run: yamllint .

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pipx install ansible-lint

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run ansible-lint
        run: |
          if [ -d ansible ] && find ansible -type f \( -name "*.yml" -o -name "*.yaml" \) | grep -q .; then
            cd ansible
            ansible-lint playbooks/site.yml
          else
            echo "No Ansible YAML files found, skipping ansible-lint"
          fi
          
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run helm lint
        run: |
          found=0

          for chart in helm/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              found=1
              helm lint "$chart"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No Helm charts found, skipping helm lint"
          fi