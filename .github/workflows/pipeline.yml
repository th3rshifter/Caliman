name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/th3rshifter/caliman
  IMAGE_TAG: ${{ github.sha }}

jobs:
  yaml-lint:
    name: YAML lint ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pipx install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .
          echo "✅ YAML lint passed"

  app-check:
    name: App check ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            echo "✅ Python dependencies installed"
          else
            echo "⏭️ requirements.txt not found, skipping dependency install"
          fi

      - name: Compile app sources
        run: |
          if [ -d app ]; then
            python -m compileall app
            echo "✅ Python compile check passed"
          else
            echo "❌ app directory not found"
            exit 1
          fi

      - name: Import FastAPI application
        run: |
          python - <<'PY'
          from app.main import app
          print(f"✅ Imported FastAPI app: {app.title}")
          PY

      - name: Run app smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > app.log 2>&1 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "✅ /health passed"
              curl -fsS http://127.0.0.1:8080/ready
              echo "✅ /ready passed"
              curl -fsS http://127.0.0.1:8080/
              echo "✅ / passed"
              echo "✅ App smoke test passed"
              exit 0
            fi

            echo "⏳ Waiting for app to start: attempt ${i}/30"
            sleep 2
          done

          echo "❌ App smoke test failed"
          cat app.log
          exit 1

  syscheck:
    name: Syscheck ✅
    runs-on: ubuntu-latest
    needs:
      - app-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install syscheck dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil rich
          echo "✅ syscheck dependencies installed"

      - name: Run app/syscheck.py
        run: |
          if [ ! -f app/syscheck.py ]; then
            echo "❌ app/syscheck.py not found"
            exit 1
          fi

          timeout 360s python app/syscheck.py
          echo "✅ app/syscheck.py passed"

  ansible-lint:
    name: Ansible lint ✅
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: >-
        ${{ github.workspace }}/ansible/collections:
        /home/runner/.ansible/collections:
        /usr/share/ansible/collections

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ansible-lint
        run: pipx install ansible-lint

      - name: Install Ansible collections
        run: >-
          ansible-galaxy collection install
          -r ansible/requirements.yml
          -p ansible/collections

      - name: Show installed Ansible collections
        run: ansible-galaxy collection list

      - name: Run ansible-lint
        run: |
          if [ -d ansible ] && find ansible -type f \( -name "*.yml" -o -name "*.yaml" \) | grep -q .; then
            ansible-lint ansible/playbooks/site.yml
            echo "✅ Ansible lint passed"
          else
            echo "⏭️ No Ansible YAML files found, skipping ansible-lint"
          fi

  ansible-syntax:
    name: Ansible syntax ✅
    runs-on: ubuntu-latest
    needs:
      - ansible-lint
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: >-
        ${{ github.workspace }}/ansible/collections:
        /home/runner/.ansible/collections:
        /usr/share/ansible/collections

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Install Ansible collections
        run: >-
          ansible-galaxy collection install
          -r ansible/requirements.yml
          -p ansible/collections

      - name: Run Ansible playbook syntax check
        run: |
          cd ansible
          ansible-playbook playbooks/site.yml --syntax-check
          echo "✅ Ansible playbook syntax check passed"

  helm-lint:
    name: Helm lint ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run helm lint
        run: |
          if [ ! -d helm ]; then
            echo "⏭️ No helm directory found, skipping helm lint"
            exit 0
          fi

          found=0

          for chart in helm/*; do
            if [ -f "$chart/Chart.yaml" ]; then
              found=1
              helm lint "$chart"
              echo "✅ Helm lint passed for $chart"
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "⏭️ No Helm charts found, skipping helm lint"
          fi

  dockerfile-lint:
    name: Dockerfile lint ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint advisory check
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          ignore: DL3008

      - name: Print Hadolint status
        run: echo "✅ Dockerfile lint passed. Advisory warnings are non-blocking."

  secrets-scan:
    name: Secrets scan ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Gitleaks status
        run: echo "✅ Gitleaks secrets scan passed"

  dependency-audit:
    name: Dependency audit ✅
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run pip-audit advisory check
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install pip-audit
            pip-audit -r requirements.txt || {
              echo "⚠️ pip-audit found vulnerabilities. Report is advisory for now."
              exit 0
            }
            echo "✅ pip-audit dependency scan passed"
          else
            echo "⏭️ requirements.txt not found, skipping pip-audit"
          fi

  frontend-build:
    name: Frontend build ✅
    runs-on: ubuntu-latest
    needs:
      - yaml-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static frontend
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          echo "✅ frontend static files validated"

      - name: Prepare Pages artifact
        run: |
          rm -rf public
          mkdir -p public
          cp -R frontend/. public/
          echo "${{ github.sha }}" > public/BUILD_SHA.txt
          echo "✅ frontend artifact prepared"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  docker-build:
    name: Docker build ✅
    runs-on: ubuntu-latest
    needs:
      - yaml-lint
      - app-check
      - syscheck
      - ansible-lint
      - ansible-syntax
      - helm-lint
      - dockerfile-lint
      - secrets-scan
      - dependency-audit
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --pull --tag caliman:${IMAGE_TAG} .
          echo "✅ Docker image built: caliman:${IMAGE_TAG}"

      - name: Run container smoke test
        run: |
          docker rm -f caliman-smoke >/dev/null 2>&1 || true
          docker run -d --name caliman-smoke -p 8080:8080 caliman:${IMAGE_TAG}

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "✅ Container /health passed"
              curl -fsS http://127.0.0.1:8080/ready
              echo "✅ Container /ready passed"
              curl -fsS http://127.0.0.1:8080/
              echo "✅ Container / passed"
              docker rm -f caliman-smoke
              echo "✅ Docker smoke test passed"
              exit 0
            fi

            echo "⏳ Waiting for container to start: attempt ${i}/30"
            sleep 2
          done

          echo "❌ Docker smoke test failed"
          docker logs caliman-smoke
          docker rm -f caliman-smoke
          exit 1

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: caliman:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          vuln-type: os,library
          exit-code: "0"

      - name: Print scan status
        run: echo "✅ Trivy scan finished"

  docker-publish:
    name: Publish image to GHCR ✅
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Print publish status
        run: |
          echo "✅ Published image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "✅ Published image: ${{ env.IMAGE_NAME }}:latest"

  pages-deploy:
    name: Deploy frontend to GitHub Pages 🚀
    runs-on: ubuntu-latest
    needs:
      - frontend-build
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Pages status
        run: |
          echo "✅ Frontend deployed to GitHub Pages"
          echo "🌐 ${{ steps.deployment.outputs.page_url }}"

  pipeline-summary:
    name: Pipeline summary ✅
    runs-on: ubuntu-latest
    if: always()
    needs:
      - yaml-lint
      - app-check
      - syscheck
      - ansible-lint
      - ansible-syntax
      - helm-lint
      - dockerfile-lint
      - secrets-scan
      - dependency-audit
      - frontend-build
      - docker-build
      - docker-publish
      - pages-deploy

    steps:
      - name: Write GitHub Actions summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Caliman Pipeline Summary ✅

          ## Build metadata

          | Field | Value |
          |---|---|
          | Repository | `${{ github.repository }}` |
          | Branch / ref | `${{ github.ref }}` |
          | Commit | `${{ github.sha }}` |
          | Event | `${{ github.event_name }}` |
          | Image SHA tag | `${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}` |
          | Image latest tag | `${{ env.IMAGE_NAME }}:latest` |
          | Frontend URL | `https://th3rshifter.github.io/Caliman/` |

          ## Quality gates

          | Stage | Result |
          |---|---|
          | YAML lint | `${{ needs.yaml-lint.result }}` |
          | App check | `${{ needs.app-check.result }}` |
          | Syscheck | `${{ needs.syscheck.result }}` |
          | Ansible lint | `${{ needs.ansible-lint.result }}` |
          | Ansible syntax | `${{ needs.ansible-syntax.result }}` |
          | Helm lint | `${{ needs.helm-lint.result }}` |
          | Dockerfile lint | `${{ needs.dockerfile-lint.result }}` |
          | Secrets scan | `${{ needs.secrets-scan.result }}` |
          | Dependency audit | `${{ needs.dependency-audit.result }}` |
          | Frontend build | `${{ needs.frontend-build.result }}` |
          | Docker build and smoke test | `${{ needs.docker-build.result }}` |
          | GHCR publish | `${{ needs.docker-publish.result }}` |
          | GitHub Pages deploy | `${{ needs.pages-deploy.result }}` |

          ## Policy

          - ✅ Build, app smoke test, syscheck, Ansible syntax, Helm lint and frontend build are blocking checks.
          - ⚠️ Hadolint DL3008 and pip-audit findings are advisory for now.
          - 📦 Images are published only on `push` to `main`.
          - 🌐 Frontend is deployed to GitHub Pages only on `push` to `main`.
          EOF

          echo "✅ Pipeline summary generated"
